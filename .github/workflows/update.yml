name: NFP update
on:
  schedule:
    - cron: "0 16 * * 5"   # every Friday 18:00 SAST
    - cron: "0 8 * * 6"    # Saturday backup run
  workflow_dispatch:        # lets you run it by hand too
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pandas fredapi tzdata
      - run: python update_pipeline.py
        env:
          FRED_API_KEY: ${{ secrets.b3935149b33724831582541f8f482663 }}
      - run: |
          git config user.name "nfp-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "NFP update $(date +%F)" || echo "nothing new"
          git push