name: NFP update
on:
  push:
    paths: [nfp_consensus.csv, cpi_consensus.csv]   # saves the prediction as soon as you add a forecast
  schedule:
    - cron: "0 16 * * 1-5"   # weekdays 18:00 SAST, after any 8:30 New York release
  workflow_dispatch:          # run it by hand from the Actions tab
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pandas fredapi tzdata
      - run: python update_pipeline.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - run: |
          git config user.name "nfp-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "Update $(date +%F)" || echo "nothing new"
          git push